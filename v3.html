<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>防災・備蓄管理 V3 修正版</title>

<style>
body{
  margin:0;
  padding:18px;
  background:#f4f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  color:#222;
}

h1{font-size:27px;margin-bottom:6px}

.card{
  background:#fff;
  padding:18px;
  border-radius:18px;
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:5px;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  font-size:18px;
  border:1px solid #ddd;
  border-radius:10px;
}

button{
  width:100%;
  padding:15px;
  margin-top:14px;
  border:0;
  border-radius:12px;
  font-size:19px;
  font-weight:bold;
  color:white;
}

#calcBtn{background:#3867e8}
#saveBtn{background:#198754}
#resetBtn{background:#777}

.result{
  font-size:18px;
  line-height:1.7;
}

.ok{color:#198754;font-weight:bold}
.ng{color:#c52b1e;font-weight:bold}
</style>
</head>

<body>

<h1>防災・備蓄管理 🧯</h1>

<div class="card">
<h2>家族構成</h2>

<label>大人</label>
<input id="adult" type="number" min="0" value="2">

<label>子ども</label>
<input id="child" type="number" min="0" value="1">

<label>高齢者</label>
<input id="senior" type="number" min="0" value="0">

<label>備蓄日数</label>
<select id="days">
<option value="3">3日</option>
<option value="7" selected>7日</option>
<option value="14">14日</option>
</select>
</div>

<div class="card">
<h2>現在の備蓄</h2>

<label>飲料水（L）</label>
<input id="water" type="number" min="0" value="0">

<label>食事（食）</label>
<input id="food" type="number" min="0" value="0">

<label>簡易トイレ（回分）</label>
<input id="toilet" type="number" min="0" value="0">

<button id="calcBtn">計算する</button>
<button id="saveBtn">💾 計算して保存する</button>
<button id="resetBtn">保存データをリセット</button>
</div>

<div class="card">
<h2>計算結果</h2>
<div id="result" class="result">
まだ計算されていません
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

  const adult = document.getElementById("adult");
  const child = document.getElementById("child");
  const senior = document.getElementById("senior");
  const days = document.getElementById("days");

  const water = document.getElementById("water");
  const food = document.getElementById("food");
  const toilet = document.getElementById("toilet");

  const result = document.getElementById("result");

  function valueOf(element){
    const n = Number(element.value);
    return Number.isFinite(n) && n >= 0 ? n : 0;
  }

  function judge(lack, unit){
    if(lack <= 0){
      return "<span class='ok'>✅ 備蓄OK</span>";
    }

    return "<span class='ng'>⚠️ あと " +
      lack + unit + " 必要</span>";
  }

  function calculate(){

    const people =
      valueOf(adult) +
      valueOf(child) +
      valueOf(senior);

    const d = valueOf(days);

    if(people <= 0){
      result.innerHTML =
        "<span class='ng'>家族人数を1人以上入力してください。</span>";
      return;
    }

    const needWater = people * d * 3;
    const needFood = people * d * 3;
    const needToilet = people * d * 5;

    const stockWater = valueOf(water);
    const stockFood = valueOf(food);
    const stockToilet = valueOf(toilet);

    const lackWater =
      Math.max(0, needWater - stockWater);

    const lackFood =
      Math.max(0, needFood - stockFood);

    const lackToilet =
      Math.max(0, needToilet - stockToilet);

    result.innerHTML =
      "<b>家族：" + people + "人・" + d + "日分</b><br><br>" +

      "<b>💧 飲料水</b><br>" +
      "必要：" + needWater + "L<br>" +
      "現在：" + stockWater + "L<br>" +
      judge(lackWater,"L") +

      "<br><br><b>🍚 食事</b><br>" +
      "必要：" + needFood + "食<br>" +
      "現在：" + stockFood + "食<br>" +
      judge(lackFood,"食") +

      "<br><br><b>🚽 簡易トイレ</b><br>" +
      "必要：" + needToilet + "回分<br>" +
      "現在：" + stockToilet + "回分<br>" +
      judge(lackToilet,"回分");
  }

  function saveData(){

    calculate();

    const data = {
      adult:adult.value,
      child:child.value,
      senior:senior.value,
      days:days.value,
      water:water.value,
      food:food.value,
      toilet:toilet.value
    };

    localStorage.setItem(
      "bousaiStockDataV3",
      JSON.stringify(data)
    );

    alert("計算結果と備蓄データを保存しました！💾");
  }

  function loadData(){

    const saved =
      localStorage.getItem("bousaiStockDataV3");

    if(!saved) return;

    try{
      const data = JSON.parse(saved);

      adult.value = data.adult ?? 2;
      child.value = data.child ?? 1;
      senior.value = data.senior ?? 0;
      days.value = data.days ?? 7;
      water.value = data.water ?? 0;
      food.value = data.food ?? 0;
      toilet.value = data.toilet ?? 0;

      calculate();

    }catch(e){
      localStorage.removeItem("bousaiStockDataV3");
    }
  }

  function resetData(){

    if(!confirm("保存したデータを削除しますか？")){
      return;
    }

    localStorage.removeItem("bousaiStockDataV3");

    adult.value = 2;
    child.value = 1;
    senior.value = 0;
    days.value = 7;

    water.value = 0;
    food.value = 0;
    toilet.value = 0;

    result.innerHTML =
      "保存データをリセットしました。";
  }

  document
    .getElementById("calcBtn")
    .addEventListener("click", calculate);

  document
    .getElementById("saveBtn")
    .addEventListener("click", saveData);

  document
    .getElementById("resetBtn")
    .addEventListener("click", resetData);

  loadData();
});
</script>

</body>
</html>
