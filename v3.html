<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防災・備蓄管理 V3</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#f4f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

h1{
  font-size:28px;
  margin-bottom:5px;
}

.subtitle{
  color:#666;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  font-size:18px;
  border:1px solid #ddd;
  border-radius:10px;
}

button{
  width:100%;
  padding:16px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#3867e8;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.save{
  background:#198754;
}

.reset{
  background:#777;
}

.result{
  font-size:18px;
  line-height:1.7;
}

.ok{
  color:#198754;
  font-weight:bold;
}

.ng{
  color:#c52b1e;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>防災・備蓄管理 🧯</h1>
<div class="subtitle">家族に必要な備蓄量をチェック</div>

<div class="card">

<h2>家族構成</h2>

<label>大人</label>
<input id="adult" type="number" min="0" value="2">

<label>子ども</label>
<input id="child" type="number" min="0" value="1">

<label>高齢者</label>
<input id="senior" type="number" min="0" value="0">

<label>備蓄日数</label>
<select id="days">
<option value="3">3日</option>
<option value="7" selected>7日</option>
<option value="14">14日</option>
</select>

<h2>現在の備蓄</h2>

<label>飲料水（L）</label>
<input id="water" type="number" min="0" value="0">

<label>食事（食）</label>
<input id="food" type="number" min="0" value="0">

<label>簡易トイレ（回分）</label>
<input id="toilet" type="number" min="0" value="0">

<button onclick="calc()">計算する</button>
<button class="save" onclick="saveData()">💾 保存する</button>
<button class="reset" onclick="resetData()">保存データをリセット</button>

</div>

<div class="card">

<h2>計算結果</h2>

<div id="result" class="result">
まだ計算されていません
</div>

</div>

<script>

const adult = document.getElementById("adult");
const child = document.getElementById("child");
const senior = document.getElementById("senior");
const days = document.getElementById("days");

const water = document.getElementById("water");
const food = document.getElementById("food");
const toilet = document.getElementById("toilet");

const result = document.getElementById("result");

function calc(){

  const people =
    Number(adult.value) +
    Number(child.value) +
    Number(senior.value);

  const d = Number(days.value);

  const needWater = people * d * 3;
  const needFood = people * d * 3;
  const needToilet = people * d * 5;

  const waterLack =
    Math.max(0, needWater - Number(water.value));

  const foodLack =
    Math.max(0, needFood - Number(food.value));

  const toiletLack =
    Math.max(0, needToilet - Number(toilet.value));

  function judge(lack,unit){

    if(lack === 0){
      return "<span class='ok'>✅ 備蓄OK</span>";
    }

    return "<span class='ng'>⚠️ あと" +
      lack + unit + "必要</span>";
  }

  result.innerHTML =
    "<b>家族：" + people + "人</b><br><br>" +

    "<b>💧 水</b><br>" +
    "必要 " + needWater + "L ／ 現在 " +
    water.value + "L<br>" +
    judge(waterLack,"L") +

    "<br><br><b>🍚 食事</b><br>" +
    "必要 " + needFood + "食 ／ 現在 " +
    food.value + "食<br>" +
    judge(foodLack,"食") +

    "<br><br><b>🚽 簡易トイレ</b><br>" +
    "必要 " + needToilet + "回分 ／ 現在 " +
    toilet.value + "回分<br>" +
    judge(toiletLack,"回分");
}

function saveData(){

  const data = {
    adult:adult.value,
    child:child.value,
    senior:senior.value,
    days:days.value,
    water:water.value,
    food:food.value,
    toilet:toilet.value
  };

  localStorage.setItem(
    "bousaiStockData",
    JSON.stringify(data)
  );

  alert("備蓄データを保存しました！💾");
}

function loadData(){

  const saved =
    localStorage.getItem("bousaiStockData");

  if(!saved){
    return;
  }

  const data = JSON.parse(saved);

  adult.value = data.adult ?? 2;
  child.value = data.child ?? 1;
  senior.value = data.senior ?? 0;
  days.value = data.days ?? 7;
  water.value = data.water ?? 0;
  food.value = data.food ?? 0;
  toilet.value = data.toilet ?? 0;

  calc();
}

function resetData(){

  if(confirm("保存した備蓄データを削除しますか？")){

    localStorage.removeItem("bousaiStockData");

    adult.value = 2;
    child.value = 1;
    senior.value = 0;
    days.value = 7;
    water.value = 0;
    food.value = 0;
    toilet.value = 0;

    result.innerHTML =
      "保存データをリセットしました";

  }
}

loadData();

</script>

</body>
</html>
