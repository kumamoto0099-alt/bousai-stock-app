<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>防災・備蓄管理 V4</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:#f4f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  color:#222;
}

h1{
  font-size:28px;
  margin:5px 0;
}

.subtitle{
  color:#666;
  margin-bottom:18px;
}

.card{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:13px;
  font-size:18px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
}

button{
  width:100%;
  padding:15px;
  margin-top:14px;
  border:0;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  color:white;
}

#calcBtn{
  background:#3867e8;
}

#saveBtn{
  background:#198754;
}

#resetBtn{
  background:#777;
}

.resultItem{
  padding:14px 0;
  border-bottom:1px solid #eee;
  line-height:1.6;
}

.resultItem:last-child{
  border-bottom:0;
}

.ok{
  color:#198754;
  font-weight:bold;
}

.ng{
  color:#c0392b;
  font-weight:bold;
}

.note{
  font-size:13px;
  color:#777;
  line-height:1.5;
}
</style>
</head>

<body>

<h1>防災・備蓄管理 🧯</h1>
<div class="subtitle">
家族に必要な備蓄量をチェック
</div>

<div class="card">

<h2>👨‍👩‍👧 家族構成</h2>

<label>大人</label>
<input id="adult" type="number" min="0" value="2">

<label>子ども</label>
<input id="child" type="number" min="0" value="1">

<label>高齢者</label>
<input id="senior" type="number" min="0" value="0">

<label>備蓄日数</label>
<select id="days">
<option value="3">3日</option>
<option value="7" selected>7日</option>
<option value="14">14日</option>
</select>

</div>

<div class="card">

<h2>📦 現在の備蓄</h2>

<label>💧 飲料水（L）</label>
<input id="water" type="number" min="0" value="0">

<label>🍚 食事（食）</label>
<input id="food" type="number" min="0" value="0">

<label>🚽 簡易トイレ（回分）</label>
<input id="toilet" type="number" min="0" value="0">

<label>🔥 カセットボンベ（本）</label>
<input id="gas" type="number" min="0" value="0">

<label>🔋 乾電池（本）</label>
<input id="battery" type="number" min="0" value="0">

<label>😷 マスク（枚）</label>
<input id="mask" type="number" min="0" value="0">

<label>🧻 ティッシュ（箱）</label>
<input id="tissue" type="number" min="0" value="0">

<label>🧼 ウェットティッシュ（個）</label>
<input id="wet" type="number" min="0" value="0">

<button id="calcBtn">
計算する
</button>

<button id="saveBtn">
💾 計算して保存する
</button>

<button id="resetBtn">
保存データをリセット
</button>

</div>

<div class="card">

<h2>📊 計算結果</h2>

<div id="summary">
まだ計算されていません
</div>

<div id="results"></div>

</div>

<div class="card">
<div class="note">
※ V4は無料版の試作です。水・食事・簡易トイレ以外の数量は、
今後テスト利用しながら目安を調整していきます。
家族の健康状態・持病・乳幼児・介護・地域事情などに合わせて、
実際の備蓄内容は調整してください。
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded",function(){

const ids=[
"adult","child","senior","days",
"water","food","toilet","gas",
"battery","mask","tissue","wet"
];

const el={};

ids.forEach(function(id){
  el[id]=document.getElementById(id);
});

const summary=
document.getElementById("summary");

const results=
document.getElementById("results");

function num(id){
  const n=Number(el[id].value);
  return Number.isFinite(n) && n>=0 ? n : 0;
}

function judge(lack,unit){

  if(lack<=0){
    return "<span class='ok'>✅ 備蓄OK</span>";
  }

  return "<span class='ng'>⚠️ あと "
  + lack + unit +
  " 必要</span>";
}

function item(
icon,
name,
need,
stock,
unit
){

  const lack=
  Math.max(0,need-stock);

  return `
  <div class="resultItem">

  <strong>${icon} ${name}</strong><br>

  必要：${need}${unit}<br>

  現在：${stock}${unit}<br>

  ${judge(lack,unit)}

  </div>
  `;
}

function calculate(){

  const people=
  num("adult")+
  num("child")+
  num("senior");

  const d=num("days");

  if(people<=0){

    summary.innerHTML=
    "<span class='ng'>家族人数を1人以上入力してください。</span>";

    results.innerHTML="";

    return;
  }

  /* 基本備蓄 */
  const needWater=
  people*d*3;

  const needFood=
  people*d*3;

  const needToilet=
  people*d*5;

  /*
  以下はV4試作用の簡易目安。
  今後調整できます。
  */

  const needGas=
  Math.ceil(people*d/3);

  const needBattery=
  Math.ceil(people*d*2/7);

  const needMask=
  people*d;

  const needTissue=
  Math.ceil(people*d/14);

  const needWet=
  Math.ceil(people*d/10);

  summary.innerHTML=
  "<strong>家族："+people+
  "人 ／ "+d+"日分</strong>";

  results.innerHTML=

  item(
  "💧",
  "飲料水",
  needWater,
  num("water"),
  "L"
  )

  +

  item(
  "🍚",
  "食事",
  needFood,
  num("food"),
  "食"
  )

  +

  item(
  "🚽",
  "簡易トイレ",
  needToilet,
  num("toilet"),
  "回分"
  )

  +

  item(
  "🔥",
  "カセットボンベ",
  needGas,
  num("gas"),
  "本"
  )

  +

  item(
  "🔋",
  "乾電池",
  needBattery,
  num("battery"),
  "本"
  )

  +

  item(
  "😷",
  "マスク",
  needMask,
  num("mask"),
  "枚"
  )

  +

  item(
  "🧻",
  "ティッシュ",
  needTissue,
  num("tissue"),
  "箱"
  )

  +

  item(
  "🧼",
  "ウェットティッシュ",
  needWet,
  num("wet"),
  "個"
  );
}

function saveData(){

  calculate();

  const data={};

  ids.forEach(function(id){
    data[id]=el[id].value;
  });

  localStorage.setItem(
  "bousaiStockV4",
  JSON.stringify(data)
  );

  alert(
  "備蓄データを保存しました！💾"
  );
}

function loadData(){

  const saved=
  localStorage.getItem(
  "bousaiStockV4"
  );

  if(!saved){
    return;
  }

  try{

    const data=
    JSON.parse(saved);

    ids.forEach(function(id){

      if(data[id]!==undefined){
        el[id].value=data[id];
      }

    });

    calculate();

  }catch(e){

    localStorage.removeItem(
    "bousaiStockV4"
    );

  }
}

function resetData(){

  if(!confirm(
  "保存した備蓄データを削除しますか？"
  )){
    return;
  }

  localStorage.removeItem(
  "bousaiStockV4"
  );

  el.adult.value=2;
  el.child.value=1;
  el.senior.value=0;
  el.days.value=7;

  el.water.value=0;
  el.food.value=0;
  el.toilet.value=0;
  el.gas.value=0;
  el.battery.value=0;
  el.mask.value=0;
  el.tissue.value=0;
  el.wet.value=0;

  summary.innerHTML=
  "保存データをリセットしました。";

  results.innerHTML="";
}

document
.getElementById("calcBtn")
.addEventListener(
"click",
calculate
);

document
.getElementById("saveBtn")
.addEventListener(
"click",
saveData
);

document
.getElementById("resetBtn")
.addEventListener(
"click",
resetData
);

loadData();

});
</script>

</body>
</html>
