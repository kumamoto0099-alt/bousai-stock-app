<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>防災・備蓄管理 V9 修正版</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#222}
h1{font-size:28px;margin:5px 0} h2{margin-top:0}.subtitle{color:#666;margin-bottom:18px}
.card{background:#fff;padding:18px;border-radius:18px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.05)}
label{display:block;font-weight:bold;margin-top:14px;margin-bottom:6px}
input,select{width:100%;padding:13px;font-size:18px;border:1px solid #ddd;border-radius:10px;background:white}
button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:12px;font-size:18px;font-weight:bold;color:white}
#calcBtn{background:#3867e8}#saveBtn{background:#198754}#resetBtn{background:#777}
.stockItem{padding:12px 0 18px;border-bottom:1px solid #eee}.stockItem:last-child{border-bottom:0}
.expiryLabel{color:#555;font-size:15px}.overall{text-align:center;padding:10px 0 18px}.bigPercent{font-size:42px;font-weight:bold}
.bar{width:100%;height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:#3867e8;width:0%;transition:width .3s}
.resultItem{padding:16px 0;border-bottom:1px solid #eee;line-height:1.7}.resultItem:last-child{border-bottom:0}
.ok{color:#198754;font-weight:bold}.warn{color:#e67e22;font-weight:bold}.ng{color:#c0392b;font-weight:bold}
.expiry{margin-top:8px;padding:8px 10px;background:#f7f7f7;border-radius:8px}.note{font-size:13px;color:#777;line-height:1.5}
.shoppingItem{padding:12px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}.shoppingItem:last-child{border-bottom:0}
.shoppingText{flex:1;line-height:1.5}.purchaseCheck{width:24px;height:24px;flex:0 0 auto;accent-color:#198754}
.purchased .shoppingText{text-decoration:line-through;color:#777}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:bold;margin-top:4px}
.badgeDone{background:#e8f5ec;color:#198754}.badgeTodo{background:#fff3e8;color:#c56a00}
</style>
</head>
<body>
<h1>防災・備蓄管理 🧯</h1>
<div class="subtitle">必要量・期限・買い物をまとめて管理</div>

<div class="card"><h2>🚨 期限アラート</h2><div id="expiryAlertSummary">まだ期限チェックされていません</div></div>
<div class="card"><h2>🛒 買い物リスト</h2><div id="shoppingList">まだ計算されていません</div></div>

<div class="card">
<h2>👨‍👩‍👧 家族構成</h2>
<label>大人</label><input id="adult" type="number" min="0" value="2">
<label>子ども</label><input id="child" type="number" min="0" value="1">
<label>高齢者</label><input id="senior" type="number" min="0" value="0">
<label>備蓄日数</label>
<select id="days"><option value="3">3日</option><option value="7" selected>7日</option><option value="14">14日</option></select>
</div>

<div class="card">
<h2>📦 現在の備蓄・期限</h2>
<div class="stockItem"><label>💧 飲料水（L）</label><input id="water" type="number" min="0" value="0"><label class="expiryLabel">賞味期限</label><input id="waterDate" type="date"></div>
<div class="stockItem"><label>🍚 食事（食）</label><input id="food" type="number" min="0" value="0"><label class="expiryLabel">賞味期限</label><input id="foodDate" type="date"></div>
<div class="stockItem"><label>🚽 簡易トイレ（回分）</label><input id="toilet" type="number" min="0" value="0"><label class="expiryLabel">使用期限</label><input id="toiletDate" type="date"></div>
<div class="stockItem"><label>🔥 カセットボンベ（本）</label><input id="gas" type="number" min="0" value="0"><label class="expiryLabel">使用期限</label><input id="gasDate" type="date"></div>
<div class="stockItem"><label>🔋 乾電池（本）</label><input id="battery" type="number" min="0" value="0"><label class="expiryLabel">使用推奨期限</label><input id="batteryDate" type="date"></div>
<div class="stockItem"><label>😷 マスク（枚）</label><input id="mask" type="number" min="0" value="0"><label class="expiryLabel">期限（任意）</label><input id="maskDate" type="date"></div>
<div class="stockItem"><label>🧻 ティッシュ（箱）</label><input id="tissue" type="number" min="0" value="0"><label class="expiryLabel">期限（任意）</label><input id="tissueDate" type="date"></div>
<div class="stockItem"><label>🧼 ウェットティッシュ（個）</label><input id="wet" type="number" min="0" value="0"><label class="expiryLabel">期限</label><input id="wetDate" type="date"></div>
<button id="calcBtn">計算する</button><button id="saveBtn">💾 計算して保存する</button><button id="resetBtn">保存データをリセット</button>
</div>

<div class="card">
<h2>📊 備蓄達成率</h2>
<div class="overall"><div id="overallPercent" class="bigPercent">0%</div><div>総合備蓄達成率</div><div class="bar"><div id="overallBar" class="fill"></div></div></div>
<div id="summary">まだ計算されていません</div><div id="results"></div>
</div>

<div class="card">
<h2>📅 期限の見方</h2>
<div class="ng">🔴 期限切れ</div><div class="warn">⚠️ 30日以内</div><div style="color:#b8860b;font-weight:bold">🟡 90日以内</div><div class="ok">🟢 91日以上</div>
<p class="note">期限が設定されていない備蓄品は「期限未登録」と表示します。</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
const ids=["adult","child","senior","days","water","food","toilet","gas","battery","mask","tissue","wet","waterDate","foodDate","toiletDate","gasDate","batteryDate","maskDate","tissueDate","wetDate"];
const el={}; ids.forEach(id=>el[id]=document.getElementById(id));
const summary=document.getElementById("summary"),results=document.getElementById("results"),shoppingList=document.getElementById("shoppingList"),overallPercent=document.getElementById("overallPercent"),overallBar=document.getElementById("overallBar");
let purchased={};

function num(id){const n=Number(el[id].value);return Number.isFinite(n)&&n>=0?n:0}
function percent(stock,need){return need<=0?100:Math.min(100,Math.round((stock/need)*100))}
function judge(lack,unit){return lack<=0?"<span class='ok'>✅ 備蓄OK</span>":"<span class='ng'>⚠️ あと "+lack+unit+" 必要</span>"}

function expiryInfo(value){
 if(!value)return {html:"📅 期限未登録",group:"none"};
 const p=value.split("-"),dt=new Date(+p[0],+p[1]-1,+p[2]);dt.setHours(0,0,0,0);
 const today=new Date();today.setHours(0,0,0,0);const diff=Math.ceil((dt-today)/86400000),display=p[0]+"/"+p[1]+"/"+p[2];
 if(diff<0)return {html:"<span class='ng'>🔴 "+display+"　期限切れ（"+Math.abs(diff)+"日経過）</span>",group:"expired"};
 if(diff<=30)return {html:"<span class='warn'>⚠️ "+display+"　期限まであと"+Math.max(0,diff)+"日</span>",group:"within30"};
 if(diff<=90)return {html:"<span style='color:#b8860b;font-weight:bold'>🟡 "+display+"　期限まで"+diff+"日</span>",group:"within90"};
 return {html:"<span class='ok'>🟢 "+display+"　期限まで"+diff+"日</span>",group:"safe"};
}

function item(icon,name,need,stock,unit,dateValue){
 const lack=Math.max(0,need-stock),p=percent(stock,need);
 return `<div class="resultItem"><strong>${icon} ${name}</strong><br>必要：${need}${unit}<br>現在：${stock}${unit}<br>達成率：${p}%<div class="bar"><div class="fill" style="width:${p}%"></div></div><br>${judge(lack,unit)}<div class="expiry">${expiryInfo(dateValue).html}</div></div>`;
}

function getNeeds(){
 const people=num("adult")+num("child")+num("senior"),d=num("days");
 return {people,days:d,water:people*d*3,food:people*d*3,toilet:people*d*5,gas:Math.ceil(people*d/3),battery:Math.ceil(people*d*2/7),mask:people*d,tissue:Math.ceil(people*d/14),wet:Math.ceil(people*d/10)};
}
function shoppingData(n){return [
 {key:"water",label:"💧 飲料水",need:n.water,stock:num("water"),unit:"L"},
 {key:"food",label:"🍚 食事",need:n.food,stock:num("food"),unit:"食"},
 {key:"toilet",label:"🚽 簡易トイレ",need:n.toilet,stock:num("toilet"),unit:"回分"},
 {key:"gas",label:"🔥 カセットボンベ",need:n.gas,stock:num("gas"),unit:"本"},
 {key:"battery",label:"🔋 乾電池",need:n.battery,stock:num("battery"),unit:"本"},
 {key:"mask",label:"😷 マスク",need:n.mask,stock:num("mask"),unit:"枚"},
 {key:"tissue",label:"🧻 ティッシュ",need:n.tissue,stock:num("tissue"),unit:"箱"},
 {key:"wet",label:"🧼 ウェットティッシュ",need:n.wet,stock:num("wet"),unit:"個"}]}

function renderShopping(n){
 const rows=shoppingData(n).filter(r=>Math.max(0,r.need-r.stock)>0);
 if(rows.length===0){shoppingList.innerHTML="<span class='ok'>✅ 必要な備蓄はそろっています</span>";return}
 shoppingList.innerHTML=rows.map(r=>{
   const lack=Math.max(0,r.need-r.stock),checked=purchased[r.key]===true;
   return `<label class="shoppingItem ${checked?"purchased":""}"><input class="purchaseCheck" type="checkbox" data-key="${r.key}" ${checked?"checked":""}><span class="shoppingText"><strong>${r.label}</strong><br>不足：${lack}${r.unit}<br><span class="badge ${checked?"badgeDone":"badgeTodo"}">${checked?"☑️ 購入済み":"未購入"}</span></span></label>`;
 }).join("");
 document.querySelectorAll(".purchaseCheck").forEach(c=>c.addEventListener("change",function(){purchased[this.dataset.key]=this.checked;savePurchasedOnly();renderShopping(getNeeds())}));
}

function updateExpiryAlerts(){
 const dateIds=["waterDate","foodDate","toiletDate","gasDate","batteryDate","maskDate","tissueDate","wetDate"];
 let expired=0,within30=0,within90=0,safe=0,none=0;
 dateIds.forEach(id=>{const g=expiryInfo(el[id].value).group;if(g==="expired")expired++;else if(g==="within30")within30++;else if(g==="within90")within90++;else if(g==="safe")safe++;else none++});
 document.getElementById("expiryAlertSummary").innerHTML="<div class='ng'>🔴 期限切れ："+expired+"件</div><br><div class='warn'>⚠️ 30日以内："+within30+"件</div><br><div style='color:#b8860b;font-weight:bold'>🟡 90日以内："+within90+"件</div><br><div class='ok'>🟢 問題なし："+safe+"件</div><br><div>📅 期限未登録："+none+"件</div>";
}

function calculate(){
 const n=getNeeds();
 if(n.people<=0){summary.innerHTML="<span class='ng'>家族人数を1人以上入力してください。</span>";results.innerHTML="";shoppingList.innerHTML="";overallPercent.textContent="0%";overallBar.style.width="0%";updateExpiryAlerts();return}
 renderShopping(n);
 const rows=shoppingData(n);let total=0;rows.forEach(r=>total+=percent(r.stock,r.need));const overall=Math.round(total/rows.length);
 overallPercent.textContent=overall+"%";overallBar.style.width=overall+"%";
 summary.innerHTML="<strong>家族："+n.people+"人 ／ "+n.days+"日分</strong>";
 results.innerHTML=
 item("💧","飲料水",n.water,num("water"),"L",el.waterDate.value)+
 item("🍚","食事",n.food,num("food"),"食",el.foodDate.value)+
 item("🚽","簡易トイレ",n.toilet,num("toilet"),"回分",el.toiletDate.value)+
 item("🔥","カセットボンベ",n.gas,num("gas"),"本",el.gasDate.value)+
 item("🔋","乾電池",n.battery,num("battery"),"本",el.batteryDate.value)+
 item("😷","マスク",n.mask,num("mask"),"枚",el.maskDate.value)+
 item("🧻","ティッシュ",n.tissue,num("tissue"),"箱",el.tissueDate.value)+
 item("🧼","ウェットティッシュ",n.wet,num("wet"),"個",el.wetDate.value);
 updateExpiryAlerts();
}

function collectData(){const data={};ids.forEach(id=>data[id]=el[id].value);data.purchased=purchased;return data}
function savePurchasedOnly(){localStorage.setItem("bousaiStockV9",JSON.stringify(collectData()))}
function saveData(){calculate();localStorage.setItem("bousaiStockV9",JSON.stringify(collectData()));alert("備蓄データ・期限・購入済みチェックを保存しました！💾")}
function applyData(data){ids.forEach(id=>{if(data[id]!==undefined)el[id].value=data[id]});purchased=data.purchased||{}}
function loadData(){
 let saved=localStorage.getItem("bousaiStockV9")||localStorage.getItem("bousaiStockV6");
 if(!saved){updateExpiryAlerts();return}
 try{applyData(JSON.parse(saved));calculate()}catch(e){localStorage.removeItem("bousaiStockV9");updateExpiryAlerts()}
}
function resetData(){
 if(!confirm("保存した備蓄データ・期限・購入済みチェックを削除しますか？"))return;
 localStorage.removeItem("bousaiStockV9");purchased={};
 el.adult.value=2;el.child.value=1;el.senior.value=0;el.days.value=7;
 ["water","food","toilet","gas","battery","mask","tissue","wet"].forEach(id=>el[id].value=0);
 ["waterDate","foodDate","toiletDate","gasDate","batteryDate","maskDate","tissueDate","wetDate"].forEach(id=>el[id].value="");
 summary.innerHTML="保存データをリセットしました。";results.innerHTML="";shoppingList.innerHTML="まだ計算されていません";overallPercent.textContent="0%";overallBar.style.width="0%";updateExpiryAlerts();
}

document.getElementById("calcBtn").addEventListener("click",calculate);
document.getElementById("saveBtn").addEventListener("click",saveData);
document.getElementById("resetBtn").addEventListener("click",resetData);
document.querySelectorAll('input[type="number"]').forEach(function(input){
  input.addEventListener("focus",function(){
    if(this.value==="0"){
      this.value="";
    }else{
      setTimeout(()=>{
        try{ this.select(); }catch(e){}
      },50);
    }
  });

  input.addEventListener("click",function(){
    if(this.value==="0"){
      this.value="";
    }
  });

  input.addEventListener("blur",function(){
    if(this.value===""){
      this.value="0";
    }
  });
});
loadData();
});
</script>
</body>
</html>
